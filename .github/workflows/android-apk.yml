name: android-test-apk

# A test build of the phone app that anyone can install straight onto an Android phone —
# no Play Store, no signing keys. For showing the app to people and trying it on real
# devices; store releases go through codemagic.yaml instead.
#
# Run it from GitHub: Actions → android-test-apk → Run workflow. The APK appears under the
# run's "Artifacts". Set the repository variable WY_API_BASE (Settings → Secrets and
# variables → Actions → Variables) to the public address of the API first.

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Capacitor 7's Android build needs JDK 21; the Android SDK is already on the runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the API address
        run: |
          if [ -z "${{ vars.WY_API_BASE }}" ]; then
            echo "::error::Set the repository variable WY_API_BASE to the API's public https address."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build the app screens and copy them into Android
        env:
          WY_API_BASE: ${{ vars.WY_API_BASE }}
        run: npm run build:mobile && npx cap sync android

      - name: Build the APK
        working-directory: client/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        # Committed from Windows, gradlew can lose its executable bit.
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WatchingYou-test-${{ github.run_number }}
          path: client/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
