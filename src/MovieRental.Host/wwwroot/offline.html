<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0C0A" />
  <title>Offline · WatchingYou</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0C0A; color: #E8F0EA;
           font: 16px/1.5 Inter, system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font: 700 24px Poppins, system-ui, sans-serif; margin: 16px 0 8px; }
    p { color: #9AA89E; max-width: 34ch; margin: 0 auto 20px; }
    a, button { display: inline-block; border: 1px solid #00E676; color: #00E676; background: none; border-radius: 999px;
                padding: 10px 20px; font: 500 14px Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; margin: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" alt="" />
    <h1 id="title">İnternet yoxdur · You're offline</h1>
    <p id="lede">Biletlərin Kino səhifəsində internetsiz də görünür. · Your saved tickets still open on the Cinema page.</p>
    <a href="/cinema">Kino / Cinema</a>
    <button onclick="location.reload()">Yenidən yoxla / Retry</button>
  </main>
  <script>
    // This page is shown whenever the site could not be reached — which is not always the
    // visitor's internet. When the device is online, the server itself is down or restarting,
    // so say that instead, and come back on our own the moment it answers again.
    (function () {
      if (!navigator.onLine) {
        window.addEventListener("online", function () { location.reload(); });
        return;
      }
      document.getElementById("title").textContent = "Server cavab vermir · Server not responding";
      document.getElementById("lede").textContent =
        "İnternetiniz var, amma sayt hələ açılmayıb və ya yenidən başladılır. Hazır olan kimi səhifə özü açılacaq. · " +
        "You are online, but the site is starting or restarting. This page reloads itself as soon as it is back.";
      setInterval(function () {
        fetch("/api/health", { cache: "no-store" })
          .then(function (r) { if (r.ok) location.reload(); })
          .catch(function () { /* still down */ });
      }, 3000);
    })();
  </script>
</body>
</html>
