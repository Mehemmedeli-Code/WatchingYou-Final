<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The default profile picture: the WatchingYou eye, close up. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0d3a22"/>
      <stop offset="1" stop-color="#03140b"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#0f6b3a"/>
      <stop offset="0.8" stop-color="#1fb864"/>
      <stop offset="1" stop-color="#3ee88a"/>
    </radialGradient>
    <radialGradient id="pupil" cx="45%" cy="45%" r="60%">
      <stop offset="0" stop-color="#062a17"/>
      <stop offset="1" stop-color="#010805"/>
