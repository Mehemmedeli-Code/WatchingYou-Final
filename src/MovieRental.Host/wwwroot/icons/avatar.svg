  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#1d9e57" stroke-width="10" opacity=".55"/>
  <circle cx="64" cy="64" r="47" fill="url(#iris)"/>
  <circle cx="64" cy="64" r="40" fill="#14a356" opacity=".55"/>
  <circle cx="66" cy="68" r="27" fill="url(#pupil)"/>
  <circle cx="44" cy="43" r="8" fill="#f2fff6"/>
